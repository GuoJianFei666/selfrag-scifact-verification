# Retrieval-quality experiments.
# A uri ending in .db selects Milvus Lite. Files are written in that directory, one per collection.
# An http://, https:// or tcp:// uri selects a Milvus server. token is sent only in that mode.
baseline:
  model_id: facebook/contriever
  revision: 2bd46a25019aeea091fd42d1f0fd4801675cf699
  max_length: 512
  normalize: false
  batch_size: 8
embedding:
  model_id: BAAI/bge-small-en-v1.5
  revision: 5c38ec7c405ec4b44b94cc5a9bb96e735b38267a
  dimension: 384
  max_length: 512
  pooling: cls
  normalize: true
  query_prefix: "Represent this sentence for searching relevant passages: "
  batch_size: 32
reranker:
  model_id: BAAI/bge-reranker-base
  revision: 2cfc18c9415c912f9d8155881c133215df768a70
  max_length: 512
  batch_size: 8
  candidates: 50
milvus:
  uri: var/retrieval-runs/milvus/scifact.db
  token: ""
  similarity: COSINE
chunking:
  sliding_window: 2
  sliding_stride: 1
  semantic_threshold: 0.5
  semantic_max_sentences: 3
  chunk_search_k: 2000
evaluation:
  split: dev
  ks: [1, 3, 5, 10, 20]
  mrr_k: 10
  ndcg_k: 10
  ranking_depth: 20
llm:
  api_key_env: RETRIEVAL_LLM_API_KEY
  base_url_env: RETRIEVAL_LLM_BASE_URL
  model_env: RETRIEVAL_LLM_MODEL
  default_base_url: https://api.openai.com/v1
finetune:
  seed: 42
  epochs: 2
  batch_size: 16
  learning_rate: 2.0e-5
  warmup_ratio: 0.1
  weight_decay: 0.01
  hard_negatives: 1
  monitor_fraction: 0.1
  max_length: 512
  loss: MultipleNegativesRankingLoss
  loss_scale: 20.0
  reranker: skip
